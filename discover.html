<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticker entdecken – Community Marktplatz | Stickiverse</title>
  <meta name="description" content="Alle Sticker-Produkte im Überblick: Rund, eckig, freigestanzt, transparent. Jetzt Sticker konfigurieren und bestellen.">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .products-page {
      padding-top: var(--nav-height);
      min-height: 100vh;
    }

    .products-header {
      padding: 60px 0 48px;
      position: relative;
      overflow: hidden;
    }

    .products-header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gradient-hero);
      pointer-events: none;
    }

    .products-header__title {
      font-size: clamp(36px, 5vw, 56px);
      font-weight: 900;
      letter-spacing: -1.5px;
      margin-bottom: 12px;
    }

    .products-header__sub {
      font-size: 17px;
      color: var(--text-secondary);
    }

    /* ── Filter Bar ── */
    .filter-bar {
      padding: 24px 0;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: var(--nav-height);
      z-index: 50;
      backdrop-filter: blur(20px);
    }

    .filter-bar__inner {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filter-bar__inner::-webkit-scrollbar { display: none; }

    .filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: var(--radius-full);
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
      font-family: 'Outfit', sans-serif;
      white-space: nowrap;
      cursor: pointer;
      transition: var(--transition);
    }

    .filter-btn:hover {
      border-color: var(--border-brand);
      color: var(--text-primary);
    }

    .filter-btn.active {
      background: var(--gradient-brand);
      border-color: transparent;
      color: white;
      box-shadow: var(--shadow-brand);
    }

    /* ── Product Grid ── */
    .products-content {
      padding: 48px 0 96px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    .product-full-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: var(--transition-slow);
      cursor: pointer;
    }

    .product-full-card:hover {
      border-color: var(--border-brand);
      transform: translateY(-6px);
      box-shadow: 0 24px 64px rgba(139,92,246,0.15);
    }

    .product-full-card__visual {
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .product-full-card__bg {
      position: absolute;
      inset: 0;
      opacity: 0.12;
      transition: opacity 0.4s ease;
    }

    .product-full-card:hover .product-full-card__bg { opacity: 0.2; }

    .product-full-card__preview {
      position: relative;
      z-index: 1;
      transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
    }

    .product-full-card:hover img {
      transform: scale(1.08);
    }

    .sticker-shape-preview {
      width: 130px;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .sticker-shape-preview--circle { border-radius: 50%; }
    .sticker-shape-preview--rect { border-radius: 12px; }
    .sticker-shape-preview--rect-wide { width: 160px; height: 100px; border-radius: 12px; }
    .sticker-shape-preview--oval { border-radius: 50%; width: 160px; height: 110px; }
    .sticker-shape-preview--star { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }

    .product-full-card__body { padding: 28px; }

    .product-full-card__tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .product-full-card__name {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .product-full-card__tagline {
      font-size: 13px;
      color: var(--purple-light);
      font-weight: 500;
      margin-bottom: 12px;
    }

    .product-full-card__desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.65;
      margin-bottom: 20px;
    }

    .product-full-card__features {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 24px;
    }

    .feature-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: rgba(139,92,246,0.1);
      border: 1px solid rgba(139,92,246,0.2);
      border-radius: var(--radius-full);
      font-size: 12px;
      color: var(--purple-light);
      font-weight: 500;
    }

    .product-full-card__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .product-full-card__price-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .product-full-card__price {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 900;
      background: var(--gradient-brand);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Size selector in modal/card ── */
    .size-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .size-chip {
      padding: 4px 12px;
      background: var(--bg-glass);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
    }

    .size-chip:hover, .size-chip.active {
      background: var(--gradient-brand);
      border-color: transparent;
      color: white;
    }

    /* ── Count badge ── */
    .results-count {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .results-count strong { color: var(--purple-light); }

    @media (max-width: 1024px) {
      .products-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 640px) {
      .products-grid { grid-template-columns: 1fr; }
    }
  
    .marketplace-page { padding-top: var(--nav-height); min-height: 100vh; }
    .marketplace-header { padding: 40px 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
    .marketplace-layout { display: grid; grid-template-columns: 260px 1fr; gap: 40px; margin-top: 20px; padding-bottom: 80px; }
    @media(max-width: 900px) { .marketplace-layout { grid-template-columns: 1fr; } }
    .marketplace-sidebar { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 12px; padding: 24px; height: fit-content; position: sticky; top: calc(var(--nav-height) + 20px); }
    .filter-group { margin-bottom: 24px; }
    .filter-group__title { font-weight: 600; margin-bottom: 12px; font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
    .filter-checkbox { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer; font-size: 14px; color: #e2e8f0; }
    .filter-checkbox input { accent-color: var(--primary); width: 16px; height: 16px; }
    
    .design-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: transform 0.2s, border-color 0.2s; display: flex; flex-direction: column; cursor: pointer; }
    .design-card:hover { transform: translateY(-4px); border-color: var(--primary); }
    .design-card__visual { position: relative; aspect-ratio: 1; background: #000; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .design-card__image { max-width: 100%; max-height: 100%; object-fit: contain; transition: transform 0.3s; }
    .design-card:hover .design-card__image { transform: scale(1.05); }
    .design-card__badge { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 4px 10px; font-size: 11px; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 6px; z-index: 10; }
    .design-card__badge--official { color: var(--primary); }
    .design-card__fav { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.4); border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid transparent; color: #fff; transition: 0.2s; z-index: 10; }
    .design-card__fav:hover { background: rgba(0,0,0,0.8); border-color: #f43f5e; color: #f43f5e; }
    .design-card__body { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
    .design-card__title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .design-card__creator { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .design-card__meta { display: flex; gap: 12px; font-size: 12px; color: var(--text-secondary); margin-bottom: 20px; }
    .design-card__footer { margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
    .design-card__price-label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
    .design-card__price { font-size: 18px; font-weight: 700; color: #fff; }

  </style>
</head>
<body>

  <!-- ── Navigation ── -->
  <nav class="nav" id="mainNav">
    <div class="container">
      <div class="nav__inner">
        <a href="index.html" class="nav__logo">
          <img src="assets/logo.png" alt="Stickiverse Logo" style="height: 42px; width: auto;">
        </a>
                <div class="nav__links" id="navLinks">
          <a href="index.html" class="nav__link" data-nav="index">Start</a>
          <a href="products.html" class="nav__link" data-nav="products">Produkte</a>
          <a href="editor.html" class="nav__link" data-nav="editor">Editor</a>
        </div>
        <div class="nav__actions">
          <a href="discover.html" class="btn btn--ghost btn--sm nav__discover-btn">Sticker entdecken</a>
          <a href="cart.html" class="nav__cart-btn" id="cartBtn">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
            <span class="nav__cart-count" id="cartCount">0</span>
          </a>
          <button class="nav__hamburger" id="navHamburger" aria-label="Menü öffnen">
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <div class="marketplace-page">
    <div class="container">
      <div class="marketplace-header">
        <div>
          <span class="section__label">Community Marktplatz</span>
          <h1 class="products-header__title" style="margin-bottom: 16px;">
            Sticker <span class="gradient-text">entdecken</span>
          </h1>
          <p class="products-header__sub">Unterstütze unabhängige Creator oder lade eigene Designs hoch.</p>
        </div>
        <div>
          <button class="btn btn--primary require-login" style="display: none; align-items: center; gap: 8px;" onclick="window.location.href='design-upload.html'">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
            Eigenes Design hochladen
          </button>
        </div>
      </div>
      
      <!-- Search Bar -->
      <div style="margin-bottom: 20px;">
        <input type="text" class="form-input" placeholder="🔍 Suche nach Designs, Creatorn oder Kategorien..." style="width: 100%; padding: 16px; border-radius: 12px; font-size: 16px;">
      </div>

      <div class="marketplace-layout">
        <!-- Sidebar Filters -->
        <aside class="marketplace-sidebar">
          <div class="filter-group">
            <div class="filter-group__title">Sortierung</div>
            <select class="form-input" style="width: 100%; margin-bottom: 20px;">
              <option>Neueste</option>
              <option>Beliebteste</option>
              <option>Meistverkauft</option>
            </select>
          </div>
          
          <div class="filter-group">
            <div class="filter-group__title">Kategorien</div>
            <label class="filter-checkbox"><input type="checkbox"> Lustig</label>
            <label class="filter-checkbox"><input type="checkbox"> Sprüche</label>
            <label class="filter-checkbox"><input type="checkbox"> Tiere</label>
            <label class="filter-checkbox"><input type="checkbox"> Gaming</label>
            <label class="filter-checkbox"><input type="checkbox"> Retro</label>
            <label class="filter-checkbox"><input type="checkbox"> Streetwear</label>
            <label class="filter-checkbox"><input type="checkbox"> Minimalistisch</label>
          </div>

          <div class="filter-group">
            <div class="filter-group__title">Urheber</div>
            <label class="filter-checkbox"><input type="checkbox"> Nur Community-Designs</label>
            <label class="filter-checkbox"><input type="checkbox"> Offizielle Stickiverse-Designs</label>
          </div>
          
          <div class="filter-group">
            <div class="filter-group__title">Stickerform</div>
            <label class="filter-checkbox"><input type="checkbox"> Freigestanzt</label>
            <label class="filter-checkbox"><input type="checkbox"> Rund</label>
            <label class="filter-checkbox"><input type="checkbox"> Quadratisch</label>
            <label class="filter-checkbox"><input type="checkbox"> Transparent</label>
          </div>
        </aside>

        <!-- Grid -->
        <div>
          <div style="margin-bottom: 20px; color: var(--text-secondary); font-size: 14px;"><strong>4</strong> Designs gefunden</div>
          <div class="products-grid" id="marketplaceGrid">
            <!-- Rendered via JS -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Footer ── -->
  <footer class="footer">
    <div class="container">
      <div class="footer__bottom">
        <span>© 2025 Stickiverse.de – Alle Rechte vorbehalten</span>
        <span>Made with in Deutschland</span>
      </div>
    </div>
  </footer>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/products.js?v=2"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth-ui.js"></script>
  <script src="js/designs.js"></script>
  <script>

    function toggleFav(e, id) {
      e.stopPropagation();
      e.currentTarget.style.color = '#f43f5e';
      showToast('Zu Favoriten hinzugefügt! ❤️', 'success');
    }

    function renderMarketplace() {
      const grid = document.getElementById('marketplaceGrid');
      
      grid.innerHTML = MOCK_DESIGNS.map(d => {
        const badge = d.isOfficial 
          ? `<div class="design-card__badge design-card__badge--official"><span style="color:var(--primary);">✨</span> Offizielles Design</div>`
          : `<div class="design-card__badge">🚀 Community</div>`;
          
        return `
          <div class="design-card" onclick="window.location='design-detail.html?id=${d.id}'">
            <div class="design-card__visual">
              ${badge}
              <button class="design-card__fav" onclick="toggleFav(event, '${d.id}')">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
              </button>
              <img src="${d.image}" alt="${d.title}" class="design-card__image">
            </div>
            
            <div class="design-card__body">
              <div class="design-card__title">${d.title}</div>
              <div class="design-card__creator">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                ${d.creator}
              </div>
              <div class="design-card__meta">
                <span>📦 ${d.shape}</span>
                <span>🔥 ${d.sales} Verkäufe</span>
              </div>
              
              <div class="design-card__footer">
                <div>
                  <div class="design-card__price-label">ab 1 Stück</div>
                  <div class="design-card__price">${d.price.toFixed(2).replace('.', ',')} €</div>
                </div>
                <button class="btn btn--secondary" style="padding: 10px 16px;" onclick="event.stopPropagation(); window.location='design-detail.html?id=${d.id}'">
                  Bestellen
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderMarketplace();
    });
  </script>
<script src="js/theme-toggle.js"></script>
<script src="js/nav.js"></script>
</body>
</html>
