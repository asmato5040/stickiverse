<!-- =============================================
     AUTH MODAL – einbinden in jede HTML-Seite
     <script src="js/config.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
     <script src="js/auth.js"></script>
     und diesen Block vor </body> einfügen
     ============================================= -->

<style>
/* ── Auth Modal Overlay ── */
.auth-modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(12px);
  z-index: 9000;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.auth-modal-overlay.show { display: flex; }

.auth-modal {
  background: var(--bg-primary);
  border: 1px solid rgba(255,210,63,0.25);
  border-radius: 28px;
  padding: 40px;
  width: 100%;
  max-width: 440px;
  box-shadow: 0 32px 128px rgba(255,210,63,0.25);
  animation: fadeIn 0.3s ease;
  position: relative;
}

.auth-modal__close {
  position: absolute;
  top: 16px; right: 16px;
  width: 32px; height: 32px;
  background: rgba(var(--ink-rgb),0.06);
  border: 1px solid rgba(var(--ink-rgb),0.1);
  border-radius: 8px;
  color: rgba(var(--ink-rgb),0.5);
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.auth-modal__close:hover { background: rgba(var(--ink-rgb),0.1); color: var(--text-primary); }

.auth-modal__logo {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 28px;
}
.auth-modal__logo-icon {
  width: 38px; height: 38px;
  background: var(--accent);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  
}
.auth-modal__logo-name {
  font-family: 'Outfit', sans-serif;
  font-size: 20px; font-weight: 800;
  color: var(--text-primary);
}

.auth-modal__title {
  font-family: 'Outfit', sans-serif;
  font-size: 26px; font-weight: 800;
  letter-spacing: -0.5px;
  margin-bottom: 6px;
}
.auth-modal__subtitle {
  font-size: 14px; color: rgba(var(--ink-rgb),0.5);
  margin-bottom: 28px;
}

/* OAuth Buttons */
.oauth-buttons { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }

.oauth-btn {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 18px;
  background: rgba(var(--ink-rgb),0.05);
  border: 1px solid rgba(var(--ink-rgb),0.1);
  border-radius: 12px;
  color: var(--text-primary);
  font-size: 15px; font-weight: 600;
  font-family: 'Outfit', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
}
.oauth-btn:hover { background: rgba(var(--ink-rgb),0.09); border-color: rgba(var(--ink-rgb),0.18); }
.oauth-btn__icon { width: 22px; height: 22px; flex-shrink: 0; }

.auth-divider {
  display: flex; align-items: center; gap: 12px;
  margin: 20px 0;
  color: rgba(var(--ink-rgb),0.3); font-size: 13px;
}
.auth-divider::before, .auth-divider::after {
  content: ''; flex: 1; height: 1px;
  background: rgba(var(--ink-rgb),0.08);
}

/* Auth Forms */
.auth-form { display: flex; flex-direction: column; gap: 14px; }

.auth-input-group { display: flex; flex-direction: column; gap: 6px; }
.auth-label { font-size: 13px; font-weight: 500; color: rgba(var(--ink-rgb),0.6); }
.auth-input {
  padding: 12px 14px;
  background: rgba(var(--ink-rgb),0.05);
  border: 1px solid rgba(var(--ink-rgb),0.1);
  border-radius: 10px;
  color: var(--text-primary); font-size: 15px;
  outline: none; transition: all 0.2s;
  font-family: 'Inter', sans-serif;
}
.auth-input:focus { border-color: #FFD23F; box-shadow: 0 0 0 3px rgba(255,210,63,0.15); }
.auth-input::placeholder { color: rgba(var(--ink-rgb),0.25); }

.auth-name-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.auth-submit-btn {
  width: 100%; padding: 14px;
  background: var(--accent);
  border: 2px solid var(--btn-edge); border-radius: 999px; box-shadow: 0 3px 0 var(--btn-edge);
  color: var(--accent-ink); font-size: 16px; font-weight: 700;
  font-family: 'Outfit', sans-serif;
  cursor: pointer; transition: all 0.2s;
  margin-top: 4px;
}
.auth-submit-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 0 var(--btn-edge); }
.auth-submit-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--btn-edge); }
.auth-submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

.auth-footer {
  margin-top: 20px; text-align: center;
  font-size: 14px; color: rgba(var(--ink-rgb),0.5);
}
.auth-footer a {
  color: var(--purple-light); font-weight: 600; cursor: pointer; text-decoration: none;
  transition: color 0.2s;
}
.auth-footer a:hover { color: var(--purple-light); }

.auth-forgot { text-align: right; margin-top: -6px; }
.auth-forgot a {
  font-size: 13px; color: rgba(var(--ink-rgb),0.45); cursor: pointer;
  transition: color 0.2s;
}
.auth-forgot a:hover { color: var(--purple-light); }

/* Nav Auth Button (logged in state) */
.nav-user-btn {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: rgba(var(--ink-rgb),0.06);
  border: 1px solid rgba(var(--ink-rgb),0.1);
  border-radius: 100px;
  color: var(--text-primary); font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
  text-decoration: none;
  position: relative;
}
.nav-user-btn:hover { background: rgba(var(--ink-rgb),0.1); border-color: rgba(255,210,63,0.3); }
.nav-user-avatar {
  width: 26px; height: 26px;
  background: var(--accent);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700;
}

@media (max-width: 480px) {
  .auth-modal { padding: 28px 20px; }
  .auth-name-row { grid-template-columns: 1fr; }
}
</style>

<!-- Auth Modal -->
<div class="auth-modal-overlay" id="authModal">
  <div class="auth-modal">
    <button class="auth-modal__close" onclick="closeAuthModal()">✕</button>

    <div class="auth-modal__logo">
      <img src="assets/logo.png" alt="Stickiverse Logo" style="height: 36px; width: auto;">
    </div>

    <h2 class="auth-modal__title" id="authModalTitle">Einloggen</h2>
    <p class="auth-modal__subtitle">Willkommen zurück! Bitte melde dich an.</p>

    <!-- OAuth -->
    <div class="oauth-buttons">
      <button class="oauth-btn" data-oauth-google>
        <svg class="oauth-btn__icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Mit Google anmelden
      </button>
      <button class="oauth-btn" data-oauth-apple>
        <svg class="oauth-btn__icon" viewBox="0 0 24 24" fill="white">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
        </svg>
        Mit Apple anmelden
      </button>
    </div>

    <div class="auth-divider">oder</div>

    <!-- Login Form -->
    <form class="auth-form" id="loginForm" style="display:flex;">
      <div class="auth-input-group">
        <label class="auth-label" for="loginEmail">E-Mail</label>
        <input type="email" id="loginEmail" class="auth-input" placeholder="deine@email.de" required>
      </div>
      <div class="auth-input-group">
        <label class="auth-label" for="loginPassword">Passwort</label>
        <input type="password" id="loginPassword" class="auth-input" placeholder="••••••••" required>
        <div class="auth-forgot"><a onclick="setAuthMode('forgot')">Passwort vergessen?</a></div>
      </div>
      <button type="submit" class="auth-submit-btn">Einloggen →</button>
      <div class="auth-footer">
        Noch kein Konto?
        <a onclick="setAuthMode('register')">Jetzt registrieren</a>
      </div>
    </form>

    <!-- Register Form -->
    <form class="auth-form" id="registerForm" style="display:none;">
      <div class="auth-name-row">
        <div class="auth-input-group">
          <label class="auth-label" for="regFirstName">Vorname</label>
          <input type="text" id="regFirstName" class="auth-input" placeholder="Max" required>
        </div>
        <div class="auth-input-group">
          <label class="auth-label" for="regLastName">Nachname</label>
          <input type="text" id="regLastName" class="auth-input" placeholder="Muster" required>
        </div>
      </div>
      <div class="auth-input-group">
        <label class="auth-label" for="regEmail">E-Mail</label>
        <input type="email" id="regEmail" class="auth-input" placeholder="deine@email.de" required>
      </div>
      <div class="auth-input-group">
        <label class="auth-label" for="regPassword">Passwort (min. 6 Zeichen)</label>
        <input type="password" id="regPassword" class="auth-input" placeholder="••••••••" minlength="6" required>
      </div>
      <div style="display:flex;align-items:flex-start;gap:10px;margin-top:4px;">
        <input type="checkbox" id="agb" required style="accent-color:#FFD23F;width:16px;height:16px;margin-top:2px;flex-shrink:0;">
        <label for="agb" style="font-size:13px;color:rgba(var(--ink-rgb),0.5);cursor:pointer;">
          Ich akzeptiere die <a href="#" style="color: var(--purple-light);">AGB</a> und
          <a href="#" style="color: var(--purple-light);">Datenschutzerklärung</a>
        </label>
      </div>
      <button type="submit" class="auth-submit-btn">Konto erstellen →</button>
      <div class="auth-footer">
        Bereits registriert?
        <a onclick="setAuthMode('login')">Einloggen</a>
      </div>
    </form>

    <!-- Forgot Password Form -->
    <form class="auth-form" id="forgotForm" style="display:none;">
      <p style="font-size:14px;color:rgba(var(--ink-rgb),0.55);margin-bottom:8px;">
        Gib deine E-Mail ein und wir schicken dir einen Link zum Zurücksetzen deines Passworts.
      </p>
      <div class="auth-input-group">
        <label class="auth-label" for="forgotEmail">E-Mail</label>
        <input type="email" id="forgotEmail" class="auth-input" placeholder="deine@email.de" required>
      </div>
      <button type="submit" class="auth-submit-btn">Reset-Link senden</button>
      <div class="auth-footer">
        <a onclick="setAuthMode('login')">← Zurück zum Login</a>
      </div>
    </form>

  </div>
</div>
